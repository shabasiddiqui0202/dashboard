<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Analytics Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav>
        <h2>📊 Data Analytics</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">Analytics</a>
            <a href="#">Reports</a>
        </div>
    </nav>


    <!-- Heading -->
    <header>
        <h1>Dashboard</h1>
        <p>Welcome to your data analytics dashboard</p>
    </header>


    <!-- Simple Cards -->
    <section class="cards">

        <div class="card">
            <p>Revenue</p>
            <h2>₹80,000</h2>
        </div>

        <div class="card">
            <p>Expenses</p>
            <h2>₹45,000</h2>
        </div>

        <div class="card">
            <p>Profit</p>
            <h2>₹35,000</h2>
        </div>

    </section>


    <!-- Your existing charts -->

    <div class="charts">

        <div class="chart-box">
            <h2>My Line Chart</h2>
            <div class="line">
                <canvas class="same" id="line"></canvas>
            </div>
        </div>


        <div class="chart-box">
            <h2>My Bar Chart</h2>
            <div class="bar">
                <canvas class="same" id="bar"></canvas>
            </div>
        </div>


        <div class="chart-box">
            <h2>My Pie Chart</h2>
            <div class="pie">
                <canvas class="same" id="pie"></canvas>
            </div>
        </div>


        <div class="chart-box">
            <h2>My Doughnut Chart</h2>
            <div class="doughnut">
                <canvas class="same" id="doughnut"></canvas>
            </div>
        </div>


        <div class="chart-box">
            <h2>My Scatter Chart</h2>
            <div class="scatter">
                <canvas class="same" id="scatter"></canvas>
            </div>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>
</html>
